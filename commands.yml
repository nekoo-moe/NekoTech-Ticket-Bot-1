# ===========================================================================
# Heiznerd Tickets — Cấu hình lệnh
# Hỗ trợ: https://heiznerd.tech/
# ===========================================================================

# ===========================================================================
# LỆNH CHUNG
# ===========================================================================

General:
  Help: # Lệnh help
    Enabled: true
    Description: "Hiển thị danh sách tất cả các lệnh"
  Ping: # Lệnh ping
    Enabled: true
    Description: "Kiểm tra độ trễ của bot"
  Stats: # Lệnh stats
    Enabled: true
    Description: "Thống kê server"
  Suggest: # Lệnh suggest
    Enabled: true
    Description: "Gửi một đề xuất"

# ===========================================================================
# LỆNH TICKET
# ===========================================================================

Ticket:
  Add: # Lệnh add
    Enabled: true
    Description: "Thêm người dùng vào ticket"
    AllowEveryoneToUse: true # Nếu false, chỉ nhân viên hỗ trợ mới dùng được
  Remove: # Lệnh remove
    Enabled: true
    Description: "Xóa người dùng khỏi ticket"
    AllowEveryoneToUse: true # Nếu false, chỉ nhân viên hỗ trợ mới dùng được
  Close: # Lệnh close
    Enabled: true
    Description: "Đóng ticket"
  Delete: # Lệnh delete
    Enabled: true
    Description: "Xóa ticket ngay lập tức"
  Panel: # Lệnh panel
    Enabled: true
    Description: "Gửi panel tạo ticket"
  Pin: # Lệnh pin
    Enabled: true
    Description: "Ghim ticket"
  Rename: # Lệnh rename
    Enabled: true
    Description: "Đổi tên ticket"
  Alert: # Lệnh alert
    Enabled: true
    Description: "Ping người tạo ticket với thông báo ticket sẽ bị đóng nếu không có phản hồi"
  Priority: # Lệnh priority
    Enabled: true
    Description: "Quản lý độ ưu tiên của ticket"
  Tag: # Lệnh tag
    Enabled: true
    Description: "Gửi tag hỗ trợ được định sẵn"
  ChangeCategory: # Lệnh changecategory
    Enabled: true
    Description: "Chuyển ticket sang danh mục khác"
  Transcript: # Lệnh transcript
    Enabled: true
    Description: "Tạo transcript của ticket hiện tại"

# ===========================================================================
# LỆNH TIỆN ÍCH
# ===========================================================================

Utility:
  Blacklist: # Lệnh blacklist
    Enabled: true
    Description: "Quản lý danh sách chặn người dùng"
  Calculate: # Lệnh calculate
    Enabled: true
    Description: "Máy tính toán học"
  Crypto: # Lệnh crypto — đã thay bằng VietQR
    Enabled: false
    Description: "Gửi thanh toán VietQR"
  Invoice: # Lệnh invoice — VietQR
    Enabled: true
    Description: "Gửi hóa đơn thanh toán"

# ===========================================================================
# LỆNH QUẢN TRỊ
# ===========================================================================

Admin:
  QuickSetup:
    Enabled: true
    Description: "Thiết lập nhanh bot cho máy chủ (role, kênh, danh mục)"
