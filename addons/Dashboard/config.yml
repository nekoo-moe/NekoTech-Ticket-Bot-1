# PERMISSION SYSTEM EXPLANATION:
# --------------------------------------------------
# The dashboard permission system has been upgraded! 
# You no longer need to manually add roles for dashboard access.
# 
# Here's how it works now:
# 1. Any user who has a role listed in the `SupportRoles` of any ticket category
#    in the main config.yml file of the ticket bot will automatically have access to the dashboard.
#
# 2. Users will ONLY be able to view tickets from the categories where they have
#    at least one support role set in the `SupportRoles` for that category.
#    For example:
#    - If a user has a support role for "Category 1", they will only see tickets from "Category 1".
#    - If they have support roles for "Category 1" and "Category 3", they will see tickets
#      from both of these categories but not from others.
# 
# This change makes managing permissions easier and ensures that support agents
# only see the tickets they are responsible for.
# 
# There's no need to configure anything extra. Just ensure that the correct 
# roles are set under `SupportRoles` for each ticket category, and the bot 
# will handle everything else automatically.
# --------------------------------------------------